[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgwm"
version = "1.0.0"
description = "LGWM: a latent world model that verifies GUI transitions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "torch==2.8.0", "timm==1.0.20", "numpy==2.2.6",
  "Pillow==11.3.0", "safetensors==0.6.2",
]

[project.optional-dependencies]
text = ["sentence-transformers==5.3.0", "transformers==5.5.0"]
training = ["pyarrow==21.0.0", "PyYAML==6.0.2"]
evaluation = ["scikit-learn==1.7.1", "pyarrow==21.0.0"]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]
